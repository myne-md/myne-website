name: issue-triage

# myne-bot issue triage, moved from n8n on the VPS to a GitHub Action. This is the
# "Route to triage" half of WF0 + WF3: on `issues.opened`, build the context packet,
# run the issue-triage skill headless via `opencode run`, and apply the verdict.
#
# The skill is a pure function (it returns JSON and touches no network). The
# deterministic halves — packet build and side effects — live in
# scripts/github-triage/. opencode is only the classifier in the middle.
#
# Cross-repo transfer needs a token with org-wide write scope, so every write uses
# MYNE_BOT_PAT, not GITHUB_TOKEN (which cannot write outside its own repo).

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    # The same two exclusions as n8n's Route to triage: never re-triage the bot's
    # own issues (which would loop or double-process transfers).
    if: >-
      github.event.sender.login != 'myne-bot' &&
      github.event.issue.user.login != 'myne-bot'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The skill body lives in the private agent-tooling companion repo. Clone it so
      # the classifier reads the canonical SKILL.md rather than a copied one (the
      # n8n box used a copied file, which drifted).
      - name: Clone agent-tooling (skill body)
        env:
          MYNE_BOT_PAT: ${{ secrets.MYNE_BOT_PAT }}
        run: |
          git clone --depth 1 https://x-access-token:${MYNE_BOT_PAT}@github.com/example-org/agent-tooling.git agent-tooling

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path

      - name: Build packet
        env:
          MYNE_BOT_PAT: ${{ secrets.MYNE_BOT_PAT }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          mkdir -p scripts/github-triage/.triage
          node scripts/github-triage/build-packet.mjs > scripts/github-triage/.triage/packet.json

      - name: Classify (opencode run)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
          TRIAGE_PACKET: scripts/github-triage/.triage/packet.json
          TRIAGE_SKILL: agent-tooling/skills/issue-triage/SKILL.md
          TRIAGE_OUT: scripts/github-triage/.triage/verdict.json
        run: node scripts/github-triage/classify.mjs

      - name: Diagnose opencode.ai reachability
        if: failure()
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          echo "=== curl chat/completions (real LLM call) ==="
          curl -sS -m 60 -w "\nhttp=%{http_code} time=%{time_total}s\n" \
            -H "Authorization: Bearer ${OPENCODE_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"model":"deepseek-v4-flash","messages":[{"role":"user","content":"say ok"}],"max_tokens":8}' \
            https://opencode.ai/zen/go/v1/chat/completions || echo "curl failed (exit $?)"

      - name: Apply verdict
        env:
          MYNE_BOT_PAT: ${{ secrets.MYNE_BOT_PAT }}
          TRIAGE_PACKET: scripts/github-triage/.triage/packet.json
          TRIAGE_VERDICT: scripts/github-triage/.triage/verdict.json
        run: node scripts/github-triage/apply-verdict.mjs
