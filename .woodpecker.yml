# Woodpecker CI — myne-website
# Self-hosted Woodpecker (cicd.myne.md) via Forgejo (git.myne.md) pull-mirror of GitHub.
#
# Flow:  push to GitHub  →  Forgejo mirror sync  →  Woodpecker build + deploy.
# Branch → environment:
#   release  →  myne.md          (prod)    image myne-website:release  → /opt/myne-website/prod
#   develop  →  preview.example.com  (staging) image myne-website:preview  → /opt/myne-website/preview
#
# Requires the repo to be marked **Trusted** in Woodpecker — the steps mount the
# host docker socket and the deploy directory to build the image and run
# `docker compose` against the host daemon (same pattern as portfolio-nano).

when:
  # `push` covers the normal flow (GitHub → Forgejo mirror sync → build).
  # `manual` lets an admin trigger a deploy from the Woodpecker UI — useful
  # because a Forgejo *pull mirror* sync does not always fire the push webhook.
  - event: [push, manual]
    branch: [release, develop]

variables:
  docker_image: &docker_image docker:28-cli
  shared_volumes: &shared_volumes
    - /var/run/docker.sock:/var/run/docker.sock
    - /opt/myne-website:/opt/myne-website

steps:
  build:
    image: *docker_image
    volumes: *shared_volumes
    commands:
      - |
        if [ "$CI_COMMIT_BRANCH" = "release" ]; then
          SITE="https://myne.md"; TAG="release"
        else
          SITE="https://preview.example.com"; TAG="preview"
        fi
      - echo "Building myne-website:$TAG with SITE=$SITE"
      - docker build --build-arg SITE="$SITE" -t "myne-website:$TAG" .

  deploy:
    image: *docker_image
    volumes: *shared_volumes
    commands:
      - |
        if [ "$CI_COMMIT_BRANCH" = "release" ]; then
          TARGET="/opt/myne-website/prod"
        else
          TARGET="/opt/myne-website/preview"
        fi
      - echo "Deploying in $TARGET"
      - cd "$TARGET"
      - docker compose up -d
      - docker image prune -f
    depends_on: [build]

  # Failure notification via Pushover. The token + group come ONLY from CI
  # secrets, never committed (public repo). A missing secret makes the step skip
  # silently; failure:ignore keeps it from ever failing the pipeline.
  notify-failure:
    image: alpine:3.21
    depends_on:
      - name: build
        optional: true
      - name: deploy
        optional: true
    environment:
      PUSHOVER_TOKEN:
        from_secret: pushover_token
      PUSHOVER_GROUP:
        from_secret: pushover_group
    commands:
      - apk add --no-cache curl
      - |
        if [ -z "$PUSHOVER_TOKEN" ]; then echo "pushover secret absent; skipping"; exit 0; fi
        curl -fsS -m 15 \
          --data-urlencode "token=$PUSHOVER_TOKEN" \
          --data-urlencode "user=$PUSHOVER_GROUP" \
          --data-urlencode "title=❌ $CI_REPO_NAME failed · $CI_COMMIT_BRANCH" \
          --data-urlencode "message=$CI_COMMIT_AUTHOR · $CI_COMMIT_MESSAGE" \
          --data-urlencode "url=$CI_PIPELINE_URL" \
          https://api.pushover.net/1/messages.json
    when:
      - event: [push, manual]
        status: failure
    failure: ignore
