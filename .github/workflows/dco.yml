name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require Signed-off-by on every commit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          fail=0
          for sha in $(git rev-list --no-merges "origin/$BASE_REF"..HEAD); do
            if ! git log -1 --format=%B "$sha" | grep -Eiq '^Signed-off-by: .+ <[^<>]+@[^<>]+>$'; then
              echo "::error::commit $sha has no Signed-off-by trailer"
              fail=1
            fi
          done
          exit "$fail"
