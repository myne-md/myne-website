# nginx server block for the static Astro build.
# Installed at /etc/nginx/conf.d/default.conf (inside the stock http{} context).
#
# LOAD-BEARING: this file is what keeps the marketing origin out of the
# client-IP business. "No persistent server-side IP logging" is a hard
# architectural commitment (main repo CLAUDE.md; threat-model.md AS14), and a
# default configuration breaks it silently: nginx:alpine's stock `main` format
# opens with $remote_addr and closes with $http_x_forwarded_for, and in the
# image /var/log/nginx/access.log is a symlink to /dev/stdout — so every
# visitor's address goes to Docker's log driver and, with the default
# json-file driver, onto disk.
#
# The same commitment is enforced at the Caddy edges by a field-delete filter
# (operations/bundle/Caddyfile and operations/deploy/web/app.example.com.caddy); nginx
# has no field-delete, so the equivalent is a format that never collects the
# fields in the first place. Do not "simplify" by dropping the log_format /
# access_log pair — that restores IP logging without changing anything a
# reader would notice. Verified by scripts/check-web-no-ip-logging.sh.
log_format noip '- - [$time_local] "$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/access.log noip;

    # nginx writes `client: <ip>` into the error log for client-triggered
    # conditions (bad requests, closed connections, missing files) at error and
    # warn level. Raising the threshold to crit drops that whole class while
    # leaving genuine server faults visible.
    error_log stderr crit;

    root /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version in headers / error pages.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        application/rss+xml
        font/woff2;

    # Astro fingerprinted assets (hashed filenames) — safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The user-guide landing page was removed — the guide opens on the Welcome
    # article. Redirect the bare /user-guide entry point (typed URLs, old
    # bookmarks, inbound links) straight there with a real 301. In-app nav links
    # already point at the article, so this only catches direct hits. (A static
    # meta-refresh fallback also ships at /user-guide/index.html for `pnpm dev`
    # / `pnpm preview`, where nginx is not in front of the build.)
    location = /user-guide  { return 301 /user-guide/getting-started/welcome/; }
    location = /user-guide/ { return 301 /user-guide/getting-started/welcome/; }

    # myne-md/myne#177: the daily-notes article became the periodic-notes
    # article when weekly and monthly landed. The old URL has been live and
    # linked, so it keeps working with a real 301 rather than a 404. Both
    # spellings, because Astro's `directory` build format means the canonical
    # form carries the trailing slash and a typed URL usually does not.
    #
    # NO matching Astro fallback page, deliberately. A stub article at the old
    # slug would be a second thing to keep true, would compete with the real one
    # in search, and would answer 200 where a 301 is the honest answer. The cost
    # is that the redirect is exercised only in front of the container, so
    # `pnpm build` and `pnpm preview` cannot see it: the acceptance line in the
    # feature record says so rather than claiming it was tested locally.
    location = /user-guide/notes-and-organization/daily-notes  {
        return 301 /user-guide/notes-and-organization/periodic-notes/;
    }
    location = /user-guide/notes-and-organization/daily-notes/ {
        return 301 /user-guide/notes-and-organization/periodic-notes/;
    }

    # Static routing: exact file, directory index (Astro `directory` build
    # format emits /page/index.html), or a sibling .html, else a real 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
