# nginx server block for the static Astro build.
# Installed at /etc/nginx/conf.d/default.conf (inside the stock http{} context).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version in headers / error pages.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        application/rss+xml
        font/woff2;

    # Astro fingerprinted assets (hashed filenames) — safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static routing: exact file, directory index (Astro `directory` build
    # format emits /page/index.html), or a sibling .html, else a real 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
