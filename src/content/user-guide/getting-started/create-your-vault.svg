<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="A vault is a folder of encrypted files on your device: each note is its own encrypted file, alongside small encrypted index files. Until you turn on sync, nothing leaves your device.">
  <style>
    .bg{fill:#f4f4f2}
    .device{fill:#fbfbfa;stroke:#c8c7c1;stroke-width:1.25}
    .tile{fill:#ecebe7;stroke:#e3e2dd;stroke-width:1}
    .lbl{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1a1a17;font-weight:600}
    .sub{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#6b6a64}
    .eye{font-family:'JetBrains Mono',ui-monospace,monospace;fill:#6b6a64;letter-spacing:.09em}
    .mono{font-family:'JetBrains Mono',ui-monospace,monospace;fill:#6b6a64}
    .lock{fill:none;stroke:#8d8c85;stroke-width:1.4}
    .strike{stroke:#8a6a1f;stroke-width:1.5}
    .accent{fill:#2c4a7a}
  </style>
  <rect class="bg" width="720" height="360"/>

  <text class="eye" x="28" y="30" font-size="11">A VAULT IS A FOLDER OF ENCRYPTED FILES</text>

  <!-- device boundary -->
  <rect class="device" x="28" y="48" width="486" height="288" rx="12"/>
  <text class="eye" x="46" y="76" font-size="10">YOUR DEVICE</text>

  <!-- folder header -->
  <path d="M46 92 h34 l8 10 h40 a6 6 0 0 1 6 6 v4 h-94 a6 6 0 0 1 -6 -6 v-12 a2 2 0 0 1 2 -2 z" fill="#2c4a7a"/>
  <text class="lbl" x="146" y="112" font-size="14">Vault folder</text>
  <text class="mono" x="146" y="128" font-size="10.5">…/myne/vaults/&lt;id&gt;/</text>

  <!-- file tiles -->
  <g>
    <!-- row 1 -->
    <g transform="translate(46,150)"><rect class="tile" width="104" height="52" rx="7"/><rect class="lock" x="14" y="14" width="14" height="12" rx="2"/><path class="lock" d="M16 14 v-4 a5 5 0 0 1 10 0 v4"/><text class="mono" x="14" y="44" font-size="10">note.myn</text></g>
    <g transform="translate(160,150)"><rect class="tile" width="104" height="52" rx="7"/><rect class="lock" x="14" y="14" width="14" height="12" rx="2"/><path class="lock" d="M16 14 v-4 a5 5 0 0 1 10 0 v4"/><text class="mono" x="14" y="44" font-size="10">note.myn</text></g>
    <g transform="translate(274,150)"><rect class="tile" width="104" height="52" rx="7"/><rect class="lock" x="14" y="14" width="14" height="12" rx="2"/><path class="lock" d="M16 14 v-4 a5 5 0 0 1 10 0 v4"/><text class="mono" x="14" y="44" font-size="10">note.myn</text></g>
    <g transform="translate(388,150)"><rect class="tile" width="104" height="52" rx="7"/><text class="mono" x="18" y="24" font-size="11" fill="#8d8c85">+ more</text><text class="mono" x="18" y="42" font-size="11" fill="#8d8c85">notes…</text></g>
    <!-- row 2 -->
    <g transform="translate(46,214)"><rect class="tile" width="104" height="52" rx="7"/><rect class="lock" x="14" y="14" width="14" height="12" rx="2"/><path class="lock" d="M16 14 v-4 a5 5 0 0 1 10 0 v4"/><text class="mono" x="14" y="44" font-size="10">vault.meta</text></g>
    <g transform="translate(160,214)"><rect class="tile" width="104" height="52" rx="7"/><rect class="lock" x="14" y="14" width="14" height="12" rx="2"/><path class="lock" d="M16 14 v-4 a5 5 0 0 1 10 0 v4"/><text class="mono" x="14" y="44" font-size="10">vault.prefs</text></g>
    <g transform="translate(274,214)"><rect class="tile" width="104" height="52" rx="7"/><rect class="lock" x="14" y="14" width="14" height="12" rx="2"/><path class="lock" d="M16 14 v-4 a5 5 0 0 1 10 0 v4"/><text class="mono" x="14" y="44" font-size="10">search idx</text></g>
    <g transform="translate(388,214)"><rect class="tile" width="104" height="52" rx="7"/><rect class="lock" x="14" y="14" width="14" height="12" rx="2"/><path class="lock" d="M16 14 v-4 a5 5 0 0 1 10 0 v4"/><text class="mono" x="14" y="44" font-size="10">attachments</text></g>
  </g>
  <text class="sub" x="46" y="292" font-size="11.5">Each note is its own encrypted file — plain Markdown only after you decrypt it.</text>

  <!-- outside: no cloud -->
  <g transform="translate(556,120)">
    <path d="M18 44 a18 18 0 0 1 4 -35 a24 24 0 0 1 45 7 a16 16 0 0 1 -5 30 z" fill="#ecebe7" stroke="#c8c7c1" stroke-width="1.25"/>
    <line class="strike" x1="10" y1="52" x2="72" y2="-2"/>
  </g>
  <text class="sub" x="602" y="196" font-size="11.5" text-anchor="middle">Local by</text>
  <text class="sub" x="602" y="212" font-size="11.5" text-anchor="middle">default.</text>
  <text class="sub" x="602" y="228" font-size="11.5" text-anchor="middle">Nothing leaves</text>
  <text class="sub" x="602" y="244" font-size="11.5" text-anchor="middle">until you sync.</text>
</svg>
