<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Myne's privacy model: one random vault key encrypts your files. Any one of three credentials — your master password (via Argon2id), your 24-word recovery phrase, or an optional device PIN or biometric — unwraps that same key. The key never leaves your device.">
  <style>
    .bg{fill:#f4f4f2}
    .card{fill:#fbfbfa;stroke:#e3e2dd;stroke-width:1}
    .soft{fill:#fbfbfa;stroke:#e3e2dd;stroke-width:1;stroke-dasharray:4 3}
    .tile{fill:#ecebe7;stroke:#e3e2dd;stroke-width:1}
    .lbl{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1a1a17;font-weight:600}
    .lbl2{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#6b6a64;font-weight:600}
    .sub{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#6b6a64}
    .eye{font-family:'JetBrains Mono',ui-monospace,monospace;fill:#6b6a64;letter-spacing:.09em}
    .mono{font-family:'JetBrains Mono',ui-monospace,monospace;fill:#6b6a64}
    .chip{fill:#e8edf5;stroke:#d3ddf0;stroke-width:1}
    .chipx{font-family:'JetBrains Mono',ui-monospace,monospace;fill:#2c4a7a}
    .accent{fill:#2c4a7a}
    .keycard{fill:#fbfbfa;stroke:#2c4a7a;stroke-width:1.5}
    .arrow{stroke:#a3a29c;stroke-width:1.5;fill:none}
    .lock{fill:none;stroke:#8d8c85;stroke-width:1.4}
    .ok{fill:#2f6048}
  </style>
  <rect class="bg" width="720" height="360"/>
  <defs>
    <marker id="ah4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#a3a29c"/>
    </marker>
  </defs>

  <text class="eye" x="28" y="28" font-size="11">ONE VAULT KEY, UNLOCKED THREE WAYS</text>

  <!-- credentials -->
  <rect class="card" x="24" y="44" width="180" height="58" rx="8"/>
  <text class="lbl" x="40" y="70" font-size="13">Master password</text>
  <rect class="chip" x="40" y="78" width="92" height="18" rx="9"/>
  <text class="chipx" x="47" y="91" font-size="9.5">Argon2id</text>

  <rect class="card" x="24" y="116" width="180" height="58" rx="8"/>
  <text class="lbl" x="40" y="142" font-size="13">Recovery phrase</text>
  <text class="sub" x="40" y="162" font-size="11">24 words, offline backup</text>

  <rect class="soft" x="24" y="188" width="180" height="58" rx="8"/>
  <text class="lbl2" x="40" y="214" font-size="13">Quick unlock</text>
  <text class="sub" x="40" y="234" font-size="11">PIN / Touch ID · optional</text>

  <!-- converge on ONE key -->
  <path class="arrow" d="M204 73 C250 88 262 140 300 158" marker-end="url(#ah4)"/>
  <path class="arrow" d="M204 145 C244 152 262 158 300 168" marker-end="url(#ah4)"/>
  <path class="arrow" d="M204 217 C250 202 262 192 300 178" marker-end="url(#ah4)"/>
  <text class="mono" x="250" y="128" font-size="10" text-anchor="middle">each unwraps</text>

  <!-- vault key -->
  <rect class="keycard" x="300" y="126" width="132" height="84" rx="10"/>
  <circle cx="330" cy="160" r="9" fill="none" stroke="#2c4a7a" stroke-width="2.2"/>
  <rect class="accent" x="337" y="157" width="26" height="6" rx="1"/>
  <rect class="accent" x="357" y="163" width="4" height="8"/>
  <rect class="accent" x="349" y="163" width="4" height="6"/>
  <text class="lbl" x="366" y="150" font-size="13" text-anchor="middle">Vault key</text>
  <text class="sub" x="366" y="186" font-size="10" text-anchor="middle">random</text>
  <text class="sub" x="366" y="199" font-size="10" text-anchor="middle">never leaves device</text>

  <!-- key -> files -->
  <path class="arrow" d="M432 168 h34" marker-end="url(#ah4)"/>
  <text class="mono" x="449" y="158" font-size="9.5" text-anchor="middle">decrypts</text>

  <!-- encrypted files -->
  <rect class="card" x="474" y="62" width="220" height="216" rx="9"/>
  <text class="eye" x="490" y="86" font-size="9.5">ENCRYPTED ON DISK</text>
  <g>
    <g transform="translate(490,98)"><rect class="tile" width="188" height="26" rx="5"/><rect class="lock" x="12" y="7" width="12" height="10" rx="2"/><path class="lock" d="M14 7 v-3 a4 4 0 0 1 8 0 v3"/><text class="mono" x="34" y="18" font-size="11">Notes</text></g>
    <g transform="translate(490,130)"><rect class="tile" width="188" height="26" rx="5"/><rect class="lock" x="12" y="7" width="12" height="10" rx="2"/><path class="lock" d="M14 7 v-3 a4 4 0 0 1 8 0 v3"/><text class="mono" x="34" y="18" font-size="11">Attachments</text></g>
    <g transform="translate(490,162)"><rect class="tile" width="188" height="26" rx="5"/><rect class="lock" x="12" y="7" width="12" height="10" rx="2"/><path class="lock" d="M14 7 v-3 a4 4 0 0 1 8 0 v3"/><text class="mono" x="34" y="18" font-size="11">Folders &amp; tags</text></g>
    <g transform="translate(490,194)"><rect class="tile" width="188" height="26" rx="5"/><rect class="lock" x="12" y="7" width="12" height="10" rx="2"/><path class="lock" d="M14 7 v-3 a4 4 0 0 1 8 0 v3"/><text class="mono" x="34" y="18" font-size="11">Snapshots · search index</text></g>
  </g>
  <text class="ok" x="490" y="256" font-size="11" font-family="Inter,ui-sans-serif,system-ui,sans-serif">✓ Tampering is detected</text>

  <!-- footer -->
  <line x1="28" y1="300" x2="692" y2="300" stroke="#e3e2dd" stroke-width="1"/>
  <text class="eye" x="28" y="324" font-size="9.5">PASSWORD KDF</text>
  <text class="mono" x="132" y="324" font-size="11">Argon2id · 256 MiB · 3 passes · 2 lanes</text>
  <text class="sub" x="28" y="344" font-size="11">Changing your password re-wraps only its copy of the key — your notes are never re-encrypted.</text>
</svg>
