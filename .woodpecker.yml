# Woodpecker CI — myne-website
# Self-hosted Woodpecker (cicd.myne.md) via Forgejo (git.myne.md) pull-mirror of GitHub.
#
# Flow:  push to GitHub  →  Forgejo mirror sync  →  Woodpecker build + deploy.
# Branch → environment:
#   release  →  myne.md          (prod)    image myne-website:release  → /opt/myne-website/prod
#   develop  →  preview.example.com  (staging) image myne-website:preview  → /opt/myne-website/preview
#
# Requires the repo to be marked **Trusted** in Woodpecker — the steps mount the
# host docker socket and the deploy directory to build the image and run
# `docker compose` against the host daemon (same pattern as portfolio-nano).

when:
  # `push` covers the normal flow (GitHub → Forgejo mirror sync → build).
  # `manual` lets an admin trigger a deploy from the Woodpecker UI — useful
  # because a Forgejo *pull mirror* sync does not always fire the push webhook.
  - event: [push]
    branch: [release, develop]
  - event: manual

variables:
  docker_image: &docker_image docker:28-cli
  shared_volumes: &shared_volumes
    - /var/run/docker.sock:/var/run/docker.sock
    - /opt/myne-website:/opt/myne-website

steps:
  # ─── Unit tests — the gate the deploy never had ───────────────
  # This repo has 17 spec files / 116 tests (`node --test`), and until now the
  # pipeline went straight from `build` to `deploy`: the word "test" did not
  # appear in this file at all. The site was published without its own tests
  # ever running anywhere but a developer's machine.
  #
  # `build` depends on this, so a red test stops the deploy rather than being
  # noticed afterwards. Node 22 matches the Dockerfile's builder stage, so the
  # tests run on the runtime the site is actually built with.
  test:
    image: node:22-slim
    commands:
      # pnpm comes from `package.json`'s `packageManager` field, which is the
      # ONE place the version is written (myne-md/myne#584). This line used to
      # say `pnpm@10` while `Dockerfile` said `pnpm@9`, against the same
      # `lockfileVersion: 9.0`, with no field tying them together and the
      # Dockerfile's own comment asserting a third thing. Tests ran on a
      # different package manager than the build.
      - npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - pnpm install --frozen-lockfile
      - pnpm test
      # The site must COMPILE on every push, and until now nothing on the push
      # path checked that: the only build was inside the docker image, which is
      # a publication step and is manual since #584. `astro build` here produces
      # nothing anyone ships, it just fails when the site cannot be built.
      # SITE is passed explicitly rather than left to `astro.config.mjs`'s
      # default, so a verification build never silently claims prod's origin.
      - SITE=https://preview.example.com pnpm build

  build:
    depends_on: [test]
    image: *docker_image
    volumes: *shared_volumes
    # MANUAL only (myne-md/myne#584). This step carried no `when` at all, so it
    # produced a docker image on every push. An image is a publication artefact
    # even before it is deployed, and the compile verification a push actually
    # owes now lives in `test` above.
    when: &manual-deploy
      - event: [manual]
        branch: [release, develop]
    commands:
      - |
        if [ "$CI_COMMIT_BRANCH" = "release" ]; then
          SITE="https://myne.md"; TAG="release"
        else
          SITE="https://preview.example.com"; TAG="preview"
        fi
      - echo "Building myne-website:$TAG with SITE=$SITE"
      - docker build --build-arg SITE="$SITE" -t "myne-website:$TAG" .

  deploy:
    image: *docker_image
    volumes: *shared_volumes
    commands:
      - |
        if [ "$CI_COMMIT_BRANCH" = "release" ]; then
          TARGET="/opt/myne-website/prod"
        else
          TARGET="/opt/myne-website/preview"
        fi
      - echo "Deploying in $TARGET"
      - cd "$TARGET"
      - docker compose up -d
      - docker image prune -f
    depends_on: [build]
    when: *manual-deploy

  # Failure notification via Pushover. The token + group come ONLY from CI
  # secrets, never committed (public repo). A missing secret makes the step skip
  # silently; failure:ignore keeps it from ever failing the pipeline.
  notify-failure:
    image: alpine:3.21
    depends_on:
      # `test` is named here and was not (myne-md/myne#584). It is now the only
      # step a push runs, since `build` and `deploy` are manual, so leaving it
      # out meant the one gate a push has could go red with nothing pushed.
      - name: test
        optional: true
      - name: build
        optional: true
      - name: deploy
        optional: true
    environment:
      PUSHOVER_TOKEN:
        from_secret: pushover_token
      PUSHOVER_GROUP:
        from_secret: pushover_group
    commands:
      - apk add --no-cache curl
      - |
        if [ -z "$PUSHOVER_TOKEN" ]; then echo "pushover secret absent; skipping"; exit 0; fi
        curl -fsS -m 15 \
          --data-urlencode "token=$PUSHOVER_TOKEN" \
          --data-urlencode "user=$PUSHOVER_GROUP" \
          --data-urlencode "title=❌ $CI_REPO_NAME failed · $CI_COMMIT_BRANCH" \
          --data-urlencode "message=$CI_COMMIT_AUTHOR · $CI_COMMIT_MESSAGE" \
          --data-urlencode "url=$CI_PIPELINE_URL" \
          https://api.pushover.net/1/messages.json
    # A PULL-REQUEST failure sends nothing, deliberately (myne-md/myne#584):
    # `myne-bot` runs a pipeline on every PR and reports on the PR itself, so a
    # push per branch iteration would be noise on top of a signal the author is
    # already reading. A push or a manual run has no such surface. All five
    # repos with a `notify-failure` step now read the same and all five say why;
    # they disagreed three ways before, with no file stating the intent.
    when:
      - event: [push, manual]
        status: failure
    failure: ignore
