<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="How zero-knowledge sync works: your device encrypts a note before it leaves; the sync server only stores ciphertext it has no keys to read; your other device decrypts it. The server is drawn outside the trust boundary.">
  <style>
    .bg{fill:#f4f4f2}
    .card{fill:#fbfbfa;stroke:#e3e2dd;stroke-width:1}
    .recessed{fill:#ecebe7;stroke:#e3e2dd;stroke-width:1}
    .tile{fill:#fbfbfa;stroke:#e3e2dd;stroke-width:1}
    .blob{fill:#d8d7d1}
    .lbl{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1a1a17;font-weight:600}
    .sub{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#6b6a64}
    .eye{font-family:'JetBrains Mono',ui-monospace,monospace;fill:#6b6a64;letter-spacing:.09em}
    .mono{font-family:'JetBrains Mono',ui-monospace,monospace;fill:#6b6a64}
    .chip{fill:#e8edf5;stroke:#d3ddf0;stroke-width:1}
    .chipx{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#2c4a7a;font-weight:600}
    .accent{fill:#2c4a7a}
    .arrow{stroke:#a3a29c;stroke-width:1.5;fill:none}
    .dash{stroke:#8a6a1f;stroke-width:1.25;stroke-dasharray:5 4;fill:none}
    .ok{fill:#2f6048}
  </style>
  <rect class="bg" width="720" height="360"/>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#a3a29c"/>
    </marker>
  </defs>

  <text class="eye" x="28" y="30" font-size="11">ZERO-KNOWLEDGE SYNC</text>

  <!-- Device A -->
  <rect class="card" x="28" y="52" width="196" height="212" rx="9"/>
  <text class="lbl" x="44" y="80" font-size="14">Your device</text>
  <rect class="tile" x="44" y="94" width="164" height="38" rx="6"/>
  <text class="sub" x="56" y="118" font-size="12">Note — plaintext</text>
  <rect class="chip" x="44" y="146" width="140" height="28" rx="14"/>
  <rect class="accent" x="56" y="155" width="9" height="10" rx="2"/>
  <path d="M57.5 155 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#2c4a7a" stroke-width="1.4"/>
  <text class="chipx" x="72" y="164" font-size="11">Encrypt on device</text>
  <text class="mono" x="44" y="198" font-size="11">a3f9 7c1b 2e08 …</text>
  <text class="sub" x="44" y="224" font-size="10.5">Your keys stay here.</text>

  <!-- A -> server -->
  <text class="mono" x="253" y="146" font-size="9.5" text-anchor="middle">encrypted</text>
  <line class="arrow" x1="228" y1="158" x2="282" y2="158" marker-end="url(#ah)"/>

  <!-- trust boundary + server -->
  <rect class="dash" x="278" y="44" width="164" height="230" rx="12"/>
  <text class="eye" x="360" y="38" font-size="9" text-anchor="middle" fill="#8a6a1f">OUTSIDE THE TRUST BOUNDARY</text>
  <rect class="recessed" x="290" y="66" width="140" height="188" rx="9"/>
  <text class="lbl" x="304" y="92" font-size="13">Sync server</text>
  <rect class="blob" x="304" y="104" width="112" height="12" rx="3"/>
  <rect class="blob" x="304" y="122" width="112" height="12" rx="3"/>
  <rect class="blob" x="304" y="140" width="88" height="12" rx="3"/>
  <text class="sub" x="304" y="176" font-size="11">Stores encrypted</text>
  <text class="sub" x="304" y="192" font-size="11">blobs it can't read.</text>
  <circle cx="312" cy="220" r="9" fill="none" stroke="#8a6a1f" stroke-width="1.4"/>
  <line x1="306" y1="226" x2="318" y2="214" stroke="#8a6a1f" stroke-width="1.4"/>
  <text class="mono" x="328" y="224" font-size="10" fill="#8a6a1f">no keys</text>

  <!-- server -> B -->
  <text class="mono" x="470" y="146" font-size="9.5" text-anchor="middle">encrypted</text>
  <line class="arrow" x1="446" y1="158" x2="494" y2="158" marker-end="url(#ah)"/>

  <!-- Device B -->
  <rect class="card" x="496" y="52" width="196" height="212" rx="9"/>
  <text class="lbl" x="512" y="80" font-size="14">Your other device</text>
  <rect class="chip" x="512" y="96" width="140" height="28" rx="14"/>
  <rect class="accent" x="524" y="105" width="9" height="10" rx="2"/>
  <path d="M525.5 105 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#2c4a7a" stroke-width="1.4"/>
  <text class="chipx" x="540" y="114" font-size="11">Decrypt on device</text>
  <rect class="tile" x="512" y="136" width="164" height="38" rx="6"/>
  <text class="sub" x="524" y="160" font-size="12">Note — plaintext</text>
  <text class="sub" x="512" y="224" font-size="10.5">Same note, readable again.</text>

  <!-- honest footer -->
  <line x1="28" y1="292" x2="692" y2="292" stroke="#e3e2dd" stroke-width="1"/>
  <text class="eye" x="28" y="314" font-size="9.5">SERVER SEES</text>
  <text class="sub" x="112" y="314" font-size="11">blob sizes · counts · version numbers · sync timing</text>
  <text class="eye" x="28" y="336" font-size="9.5" fill="#2f6048">CANNOT SEE</text>
  <text class="sub" x="112" y="336" font-size="11">your notes · titles · folders · tags · your keys</text>
</svg>
